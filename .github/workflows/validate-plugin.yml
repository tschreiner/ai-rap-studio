name: Validate plugin

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Validate runtime
        run: npm run validate
        env:
          AI_RAP_STUDIO_SKIP_SOURCE_ATTACHMENT: "1"
      - name: Validate plugin
        shell: pwsh
        run: .\scripts\validate-plugin-v2.ps1
